version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: geo-alert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-geo_alert}
      POSTGRES_USER: ${DB_USER:-geo_alert}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geo_alert} -d ${DB_NAME:-geo_alert}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo-alert-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
    container_name: geo-alert-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  adminer:
    image: adminer:4
    container_name: geo-alert-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
