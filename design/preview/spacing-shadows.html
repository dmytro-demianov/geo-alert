<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card" style="background:#F1F5F9">
  <div class="label-overline">Shadow elevation</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,0.05)"></div>
      <div class="token">xs</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.04)"></div>
      <div class="token">sm</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 4px 12px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04)"></div>
      <div class="token">md</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 12px 24px rgba(15,23,42,0.10), 0 4px 8px rgba(15,23,42,0.06)"></div>
      <div class="token">lg</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 24px 48px rgba(15,23,42,0.14), 0 8px 16px rgba(15,23,42,0.08)"></div>
      <div class="token">xl</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#EF4444;width:80px;height:60px;border-radius:10px;box-shadow:0 6px 16px rgba(239,68,68,0.45), 0 2px 4px rgba(239,68,68,0.30)"></div>
      <div class="token">pin</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:0 0 0 3px rgba(239,68,68,0.32);border:1px solid #EF4444"></div>
      <div class="token">focus</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="background:#fff;width:80px;height:60px;border-radius:10px;box-shadow:inset 0 1px 2px rgba(15,23,42,0.10);border:1px solid #E2E8F0"></div>
      <div class="token">inset</div>
    </div>
  </div>
</div>
</body></html>
