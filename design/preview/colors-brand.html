<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card">
  <div class="label-overline">Brand — Alert Red scale</div>
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px">
    <div><div style="background:#fef2f2;height:48px;border-radius:6px;border:1px solid #E2E8F0"></div><div class="token" style="margin-top:4px">50</div></div>
    <div><div style="background:#fee2e2;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">100</div></div>
    <div><div style="background:#fecaca;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">200</div></div>
    <div><div style="background:#fca5a5;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">300</div></div>
    <div><div style="background:#f87171;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">400</div></div>
    <div style="position:relative"><div style="background:#ef4444;height:48px;border-radius:6px;outline:2px solid #0F172A;outline-offset:2px"></div><div class="token" style="margin-top:4px;font-weight:700;color:#0F172A">500★</div></div>
    <div><div style="background:#dc2626;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">600</div></div>
    <div><div style="background:#b91c1c;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">700</div></div>
    <div><div style="background:#991b1b;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">800</div></div>
    <div><div style="background:#7f1d1d;height:48px;border-radius:6px"></div><div class="token" style="margin-top:4px">900</div></div>
  </div>
  <div style="font-size:12px;color:var(--fg-secondary)">★ <strong>500</strong> is the primary brand color, also <code style="font-family:var(--font-mono)">--heat-fire</code>.</div>
</div>
</body></html>
