<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card">
  <div class="label-overline">Buttons</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button style="background:#EF4444;color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:600;font-family:inherit;font-size:14px;box-shadow:0 1px 2px rgba(15,23,42,0.05);cursor:pointer">Создать карту</button>
    <button style="background:#fff;color:#0F172A;border:1px solid #CBD5E1;padding:10px 18px;border-radius:10px;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer">Отмена</button>
    <button style="background:transparent;color:#0F172A;border:0;padding:10px 14px;border-radius:10px;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer">Подробнее</button>
    <button style="background:#0F172A;color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:600;font-family:inherit;font-size:14px;cursor:pointer">Войти через Google</button>
    <button style="background:#EF4444;color:#fff;border:0;padding:0;border-radius:9999px;width:48px;height:48px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(239,68,68,0.45),0 2px 4px rgba(239,68,68,0.30);display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button style="background:#FEE2E2;color:#B91C1C;border:0;padding:6px 12px;border-radius:9999px;font-weight:600;font-family:inherit;font-size:12px;cursor:pointer">+ Подписаться</button>
    <button style="background:#fff;color:#0F172A;border:1px solid #CBD5E1;padding:6px 12px;border-radius:9999px;font-weight:600;font-family:inherit;font-size:12px;cursor:pointer">Поделиться</button>
    <button disabled style="background:#F1F5F9;color:#CBD5E1;border:0;padding:10px 18px;border-radius:10px;font-weight:600;font-family:inherit;font-size:14px;cursor:not-allowed">Disabled</button>
  </div>
</div>
</body></html>
